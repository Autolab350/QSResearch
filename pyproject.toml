[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy"
version = "0.1.0"
description = "QS desk strategy: allocations and trade Intent from text or levels. Proposes only."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["strategy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
